name: docker
on:
  push:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore', 'crm-loja-backend/**', 'crm-loja-frontend/**', '.github/workflows/docker.yml']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', '.github/workflows/docker.yml']
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm_loja }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Constrói a mesma imagem que o Render usa (não publica em lugar nenhum).
      - run: docker build -t crm-loja:ci .
      - name: Sobe a imagem como no Render (perfil demo)
        run: |
          docker run -d --name crm --network host \
            -e SPRING_PROFILES_ACTIVE=demo -e DB_HOST=localhost -e DB_NAME=crm_loja \
            -e DB_USER=crm -e DB_PASSWORD=crm -e JWT_SECRET=ci-segredo-com-mais-de-32-caracteres-0123 \
            crm-loja:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8080/login >/dev/null && break; sleep 2; done
      - name: Telas, login e API respondem
        run: |
          curl -sf http://localhost:8080/login | grep -q "<title>CRM Loja de Roupas</title>"
          # Os dados de demonstração são criados logo depois que o Tomcat sobe: espera o login existir.
          for i in $(seq 1 30); do
            curl -sf -c c.txt -X POST http://localhost:8080/auth/login -H 'Content-Type: application/json' \
              -d '{"login":"gerente@loja.local","password":"loja12345"}' >/dev/null && break
            sleep 2
          done
          curl -sf -b c.txt http://localhost:8080/crm/dashboard | grep -q confirmedSales
      - if: always()
        run: docker logs crm | tail -40
