name: frontend
on:
  push:
    branches: [main, develop]
    paths: ['crm-loja-frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['crm-loja-frontend/**', '.github/workflows/frontend.yml']
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-loja-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: crm-loja-frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crm-loja-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
