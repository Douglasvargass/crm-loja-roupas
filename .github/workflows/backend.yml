name: backend
on:
  push:
    branches: [main, develop]
    paths: ['crm-loja-backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['crm-loja-backend/**', '.github/workflows/backend.yml']
concurrency: { group: backend-${{ github.ref }}, cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-loja-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: chmod +x mvnw
      # Os testes sobem um Postgres 16 embutido (zonky), sem Docker.
      - run: ./mvnw -B verify
