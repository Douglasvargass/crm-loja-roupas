# PORT é a variável que serviços de hospedagem (Render, Railway…) usam; SERVER_PORT continua valendo.
server:
  port: ${PORT:8080}
spring:
  # Fotos dos produtos: até 2 MB cada (a regra fica no ProductImageService; aqui só a folga do formulário).
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    # DB_URL completo, ou as partes separadas (como o Render entrega).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm_loja}}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
    # Poucas conexões bastam para uma loja e economizam memória no servidor e no banco grátis.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate      # schema só muda por Flyway
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
  # Login é próprio (JWT em cookie); sem isto o Spring cria um usuário "user" e imprime a senha no log.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:600}
  refresh-token-ttl-hours: ${REFRESH_TOKEN_TTL_HOURS:24}
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  super-admin-login: ${SUPER_ADMIN_LOGIN:admin@loja.local}
  # Vazio = senha aleatória impressa uma vez no console no primeiro boot.
  super-admin-password: ${SUPER_ADMIN_PASSWORD:}
  # true em produção (HTTPS); em localhost o navegador recusa cookie Secure via http.
  cookie-secure: ${COOKIE_SECURE:false}
  time-zone: America/Sao_Paulo
  # Assistente de IA. Sem chave ele fica desligado e o resto do sistema funciona normalmente.
  # Provedores: anthropic (padrão, pago) · groq | gemini | openrouter (planos grátis) · ollama (local) · openai (outro).
  # Detalhes e limites em crm-loja-docs/docs/10-assistente-ia.md.
  assistant:
    provider: ${ASSISTANT_PROVIDER:anthropic}
    api-key: ${ASSISTANT_API_KEY:${ANTHROPIC_API_KEY:}}
    # Vazio = padrão do provedor. Ex.: https://openrouter.ai/api (anthropic) ou http://localhost:11434/v1 (ollama).
    base-url: ${ASSISTANT_BASE_URL:${ANTHROPIC_BASE_URL:}}
    # Vazio = padrão do provedor (claude-opus-5-5, openai/gpt-oss-120b, gemini-2.5-flash…).
    model: ${ASSISTANT_MODEL:}
    effort: ${ASSISTANT_EFFORT:medium}          # só na Anthropic
    # Teto de tokens por resposta. Abaixe se o provedor recusar por falta de créditos (erro 402).
    max-tokens: ${ASSISTANT_MAX_TOKENS:16000}
    max-tool-rounds: 8

# Chamadas aos provedores OpenAI-compatíveis (RestClient): uma resposta de IA pode levar mais de um minuto.
spring.http.client:
  connect-timeout: 15s
  read-timeout: 120s

---
# Perfil dev: dados de demonstração e usuários de teste (DevDataSeeder).
spring:
  config:
    activate:
      on-profile: dev
app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789abcdef0123456789abcdef}

# Perfil demo (servidor público de demonstração): mesmos dados do dev, mas JWT_SECRET obrigatório.
